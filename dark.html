<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ed" />
    <meta
      name="description"
      content="A payment card preview with a light and dark theme toggle."
    />
    <title>Theme toggle — payment card</title>
    <link rel="stylesheet" href="./dark.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script src="./dark.js" defer></script>
  </head>
  <body>
    <main class="page">
      <button
        class="theme-toggle"
        type="button"
        aria-label="Dark theme"
        aria-pressed="false"
      >
        <svg
          class="theme-toggle__icon theme-toggle__icon--sun"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
          />
        </svg>
        <svg
          class="theme-toggle__icon theme-toggle__icon--moon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z" />
        </svg>
      </button>

      <article class="payment-card" aria-label="Sample Mastercard">
        <img
          class="payment-card__map"
          src="./map.png"
          alt=""
          aria-hidden="true"
        />

        <div class="payment-card__details">
          <header class="payment-card__header">
            <h1 class="payment-card__brand">Mastercard</h1>
          </header>

          <img
            class="payment-card__chip"
            src="./chip.png"
            alt=""
            aria-hidden="true"
          />

          <dl class="payment-card__account">
            <div class="payment-card__number">
              <dt class="visually-hidden">Card number</dt>
              <dd>1234 4321 5678 8765</dd>
            </div>
            <div class="payment-card__validity">
              <dt>Valid through</dt>
              <dd>08/26</dd>
            </div>
            <div class="payment-card__holder">
              <dt class="visually-hidden">Cardholder</dt>
              <dd>Tomiwa Adewole</dd>
            </div>
          </dl>
        </div>

        <div class="payment-card__mark" aria-hidden="true">
          <span class="payment-card__circle payment-card__circle--red"></span>
          <span
            class="payment-card__circle payment-card__circle--orange"
          ></span>
        </div>
      </article>
    </main>
  </body>
</html>
